[project]
name = "ag-ui-learning-backend"
version = "0.2.0"
description = "Inspectable FastAPI backend for the AG-UI Learning Lab"
requires-python = ">=3.11"
dependencies = [
  "ag-ui-langgraph==0.0.44",
  "ag-ui-protocol==0.1.22",
  "fastapi==0.135.2",
  "langgraph>=1.0,<2.0",
  "openai==2.30.0",
  "uvicorn[standard]==0.42.0",
]

[dependency-groups]
dev = [
  "httpx==0.28.1",
  "pytest==9.0.2",
  "pytest-asyncio==1.3.0",
  "ruff==0.15.7",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
